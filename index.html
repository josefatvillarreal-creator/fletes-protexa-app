<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fletes Protexa</title>
  <meta name="theme-color" content="#f8c000">
  <meta name="description" content="Solicitudes, autorizaciones y pagos de fletes de Protexa.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Fletes">
  <style>
    :root { --bg: #ffffff; --texto: #221f1c; --suave: #6e675e; --acento: #f8c000; --borde: #e4dfd6; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1a1714; --texto: #f4f2ee; --suave: #a39b90; --borde: #3a352f; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--texto); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 380px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 22px; margin: 16px 0 4px; }
    p { margin: 6px 0; color: var(--suave); }
    .acciones { display: flex; flex-direction: column; gap: 10px; margin: 22px 0 10px; }
    button, a.boton { font: inherit; font-weight: 600; cursor: pointer; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--borde); background: transparent; color: var(--texto); text-decoration: none; }
    .primario { background: var(--acento); border-color: var(--acento); color: #221f1c; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="Fletes Protexa" width="96" height="96">
    <h1>Fletes Protexa</h1>
    <p id="estado">Solicitudes, autorizaciones y pagos de fletes en un solo lugar.</p>
    <div class="acciones">
      <a class="boton primario" id="abrir" href="#">Abrir Fletes</a>
      <button type="button" id="instalar" hidden>Instalar en este equipo</button>
    </div>
    <p id="ayuda-ios" hidden>En iPhone o iPad: toca Compartir y luego «Agregar a pantalla de inicio».</p>
  </main>
  <script src="config.js"></script>
  <script>
    (function () {
      "use strict";
      var url = window.FLETES_URL;
      var abrir = document.getElementById("abrir");
      var instalar = document.getElementById("instalar");
      abrir.setAttribute("href", url);

      var instalada = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
      // Ya instalada: se entra directo a la aplicación, sin pantallas intermedias.
      if (instalada) {
        document.getElementById("estado").textContent = "Abriendo Fletes…";
        window.location.replace(url);
        return;
      }

      if ("serviceWorker" in window.navigator) window.navigator.serviceWorker.register("sw.js").catch(function () {});

      var evento = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        evento = e;
        instalar.hidden = false;
      });
      instalar.addEventListener("click", function () {
        if (!evento) return;
        evento.prompt();
        evento.userChoice.then(function () { evento = null; instalar.hidden = true; });
      });
      window.addEventListener("appinstalled", function () { instalar.hidden = true; });

      if (/iphone|ipad|ipod/i.test(window.navigator.userAgent)) document.getElementById("ayuda-ios").hidden = false;
    })();
  </script>
</body>
</html>
